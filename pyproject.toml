[project]
name = "tpflow"
description = ""
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

dependencies = [
  "numpy",
  "jax==0.8.2",
  "flax==0.12.4",
  "h5py",
  "matplotlib",
  "hydra-core",
  "hydra-submitit-launcher",
  "humanize",
  "pandas",
  "seaborn",
  "wandb[media] (>=0.24.2,<0.25.0)",
  "jax-cfd",
  "zarr (>=3.1.5,<4.0.0)",
  "rich (>=14.3.2,<15.0.0)",
  "typer (>=0.21.1,<0.22.0)",
  "hdfv @ git+ssh://git@github.com/Algopaul/hdfv.git",
  "hdfx @ git+ssh://git@github.com/Algopaul/hdfx.git",
  "flanch @ git+ssh://git@github.com/Algopaul/flanch.git",
  "webdataset (>=1.0.2,<2.0.0)",
]

[project.optional-dependencies]
dev = [
  "pylint>=2.6.0",
  "yapf",
  "pytest",
  "isort",
]

[tool.setuptools]
packages = ["tpflow"]

[tool.pyright]
venvPath = "."
venv = ".venv"
ignore = ["**/.venv/**"]
useLibraryCodeForTypes = true
